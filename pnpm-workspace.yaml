minimumReleaseAge: 360
saveExact: true
# ecosystem-ci smoke test: pre-existing unplugin peer mismatch
strictPeerDependencies: false
updateNotifier: false
allowBuilds:
  esbuild: true
  simple-git-hooks: true

# Vite+ setup
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  vite-plus: 0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  vitest: 5.1.0
  '@vitest/browser-playwright': 5.1.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
