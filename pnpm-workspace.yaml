minimumReleaseAge: 360
saveExact: true
# Ecosystem-ci smoke test only: the project ships an unmet peer of its own
# (@stylexjs/unplugin wants unplugin ^2, the repo installs 3.x), which a
# regenerated lockfile surfaces. Unrelated to vite-plus.
strictPeerDependencies: false
updateNotifier: false
allowBuilds:
  esbuild: true
  simple-git-hooks: true

# Vite+ setup
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: 0.1.22
  vitest: npm:@voidzero-dev/vite-plus-test@latest
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
