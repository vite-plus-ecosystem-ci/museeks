minimumReleaseAge: 360
saveExact: true
strictPeerDependencies: false
updateNotifier: false
allowBuilds:
  esbuild: true
  simple-git-hooks: true

# Vite+ setup
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.134033efc595ae5efab9df5c177a9ae20904a5d9
  vite-plus: 0.0.0-commit.134033efc595ae5efab9df5c177a9ae20904a5d9
  vitest: 5.0.1
  '@vitest/browser-playwright': 5.0.1
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
