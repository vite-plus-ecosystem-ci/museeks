minimumReleaseAge: 360
saveExact: true
# ecosystem-ci smoke test: pre-existing unplugin peer mismatch
strictPeerDependencies: false
updateNotifier: false
allowBuilds:
  esbuild: true
  simple-git-hooks: true

# Vite+ setup
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: 0.1.22
  vitest: npm:@voidzero-dev/vite-plus-test@latest
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
