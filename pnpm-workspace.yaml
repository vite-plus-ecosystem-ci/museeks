minimumReleaseAge: 360
saveExact: true
# Ecosystem-ci smoke test only: the project ships an unmet peer of its own
# (@stylexjs/unplugin wants unplugin ^2, the repo installs 3.x), which a
# regenerated lockfile surfaces. Unrelated to vite-plus.
strictPeerDependencies: false
updateNotifier: false
allowBuilds:
  esbuild: true
  simple-git-hooks: true

# Vite+ setup
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642
  vite-plus: 0.0.0-commit.7ebf81e43af581194844e8fe18f65ed2eb544642
  vitest: 4.1.11
  '@vitest/browser-playwright': 4.1.11
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
